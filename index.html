<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AuthNow Verification</title>
    <style>
        /* 全局重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh; width: 100vw;
            /* 🌟 Logo 铺满全屏作为背景 */
            background: url('logo.png') no-repeat center center;
            background-size: cover; 
            overflow: hidden; /* 禁止滚动 */
            position: relative;
        }

        /* 顶部导航栏区域 (包含左上角菜单和右上角语言) */
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 80px; /* 顶部高度 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            z-index: 10;
        }

        /* 左上角汉堡菜单图标 (纯CSS绘制) */
        .menu-icon {
            width: 30px; height: 24px;
            display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer;
        }
        .menu-icon span {
            display: block; width: 100%; height: 3px;
            background-color: #333; /* 深灰色线条 */
            border-radius: 2px;
        }

        /* 🌟 右上角语言选择框 */
        .lang-box {
            border: 1.5px solid #333; /* 黑色细边框 */
            background-color: transparent; /* 背景透明 */
            color: #000; /* 黑色文字 */
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        /* 🌟 核心验证码区域 */
        .verify-container {
            position: absolute;
            bottom: 15%; /* 距离底部 15% 的位置，参考图片大概在下方 */
            left: 0; right: 0;
            text-align: left; /* 左对齐，参考图看起来是左侧对齐或者居中偏左 */
            padding-left: 25px; /* 左侧留白 */
            z-index: 10;
        }

        /* 验证码文本行 */
        .code-line {
            color: #000; /* 纯黑色文字 */
            display: flex;
            align-items: baseline; /* 基线对齐 */
            gap: 10px; /* CODE: 和 验证码之间的间距 */
        }

        /* "CODE:" 标签样式 */
        .code-label {
            font-size: 16px; /* 较小的字号 */
            font-weight: 500;
            opacity: 0.8; /* 稍微淡一点点，突出后面的码 */
        }

        /* 10位验证码样式 */
        .code-value {
            font-size: 32px; /* 较大的字号 */
            font-weight: 700; /* 加粗 */
            letter-spacing: 1px;
            font-family: monospace, sans-serif; /* 使用等宽字体让验证码更清晰 */
        }

    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <div class="top-bar">
        <!-- 左上角菜单 -->
        <div class="menu-icon">
            <span></span><span></span><span></span>
        </div>
        
        <!-- 右上角语言框 -->
        <div class="lang-box" onclick="toggleLang()">ENG</div>
    </div>

    <!-- 验证码区域 -->
    <div class="verify-container">
        <div class="code-line">
            <span class="code-label">CODE:</span>
            <span class="code-value" id="auth-code">LOADING...</span>
        </div>
    </div>

    <script>
        // 生成随机10位验证码的函数
        function generateCode(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // 页面加载时生成并显示验证码
        window.onload = function() {
            const code = generateCode(10);
            document.getElementById('auth-code').innerText = code;
        };

        // 简单的语言切换模拟
        function toggleLang() {
            const btn = document.querySelector('.lang-box');
            if(btn.innerText === 'ENG') {
                btn.innerText = '中文';
                document.querySelector('.code-label').innerText = '验证码:';
            } else {
                btn.innerText = 'ENG';
                document.querySelector('.code-label').innerText = 'CODE:';
            }
        }
    </script>
</body>
</html>
