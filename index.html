<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AuthNow - Product Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: #F2F2F7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: #FFFFFF;
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        /* 顶部绿色对勾图标 */
        .check-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
        }
        .check-icon circle { fill: #34C759; }
        .check-icon path { stroke: #FFFFFF; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .product-name {
            font-size: 22px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .auth-status {
            font-size: 15px;
            font-weight: 600;
            color: #34C759;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
        }

        /* 验证码展示区域 - 还原截图样式 */
        .code-container {
            background: #F9F9FB;
            border: 1px solid #E5E5EA;
            border-radius: 12px;
            padding: 18px 15px;
            margin-bottom: 20px;
        }

        .code-label {
            font-size: 12px;
            font-weight: 600;
            color: #8E8E93;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .code-value {
            font-family: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
            font-size: 24px;
            font-weight: 700;
            color: #000000;
            letter-spacing: 2px;
            word-break: break-all;
        }

        .hint-text {
            font-size: 13px;
            line-height: 1.6;
            color: #8E8E93;
            padding: 0 5px;
        }

        /* 右上角 ENG 按钮还原 */
        .lang-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #007AFF;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="lang-btn">ENG ▾</div>
    
    <div class="card">
        <!-- 绿色对勾 SVG -->
        <svg class="check-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="32"/>
            <path d="M20 33 L28 41 L44 25"/>
        </svg>

        <div class="product-name">T.G. 15 mg</div>
        <div class="auth-status">Authentic</div>

        <div class="code-container">
            <div class="code-label">CODE</div>
            <div class="code-value" id="verifyCode">----------</div>
        </div>

        <p class="hint-text">
            This alphanumeric code must match the code and color printed on the product label.
        </p>
    </div>

    <script>
        // 自动从 URL 提取 code 参数，无参数时保留占位符
        (function() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const codeEl = document.getElementById('verifyCode');
            
            if (code && code.trim().length > 0) {
                codeEl.textContent = code.trim();
            }
        })();
    </script>
</body>
</html>
