<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AuthNow Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* 🌟 核心：Logo 铺满全屏作为背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            height: 100vh; width: 100vw;
            background: url('logo.png') no-repeat center center;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* 屏幕正中央的验证码展示区 */
        .code-display {
            background: rgba(0, 0, 0, 0.6); /* 半透明黑色背景，确保文字清晰 */
            backdrop-filter: blur(8px);     /* 毛玻璃模糊效果 */
            -webkit-backdrop-filter: blur(8px);
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .code-value {
            font-family: "SF Mono", Menlo, monospace;
            font-size: 32px; font-weight: 700;
            color: #FFFFFF; letter-spacing: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* 右上角语言选择器 */
        .lang-wrapper { position: absolute; top: 20px; right: 20px; z-index: 100; }
        .lang-btn {
            font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer;
            display: flex; align-items: center; gap: 4px; user-select: none;
            background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 20px;
        }
        .lang-btn::after { content: '▾'; font-size: 10px; transition: transform 0.2s; }
        .lang-wrapper.open .lang-btn::after { transform: rotate(180deg); }

        .lang-dropdown {
            position: absolute; top: calc(100% + 8px); right: 0;
            background: rgba(30, 30, 30, 0.9); border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); opacity: 0; visibility: hidden;
            transform: translateY(-8px); transition: all 0.2s ease; min-width: 80px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .lang-wrapper.open .lang-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
        
        .lang-option {
            padding: 12px 20px; font-size: 14px; font-weight: 500; color: #FFF;
            cursor: pointer; white-space: nowrap; transition: background 0.15s;
        }
        .lang-option:hover, .lang-option:active { background: rgba(255,255,255,0.1); }
        .lang-option.active { color: #34C759; font-weight: 700; }

        /* 🚫 PC端拦截页（同样使用全屏背景） */
        .desktop-block { 
            display: none; text-align: center; max-width: 400px; 
            background: rgba(0,0,0,0.7); padding: 40px; border-radius: 20px;
            backdrop-filter: blur(10px); color: #FFF;
        }
        .desktop-block svg { width: 80px; height: 80px; margin-bottom: 24px; opacity: 0.8; stroke: #FFF; }
        .desktop-block h2 { font-size: 20px; margin-bottom: 12px; }
        .desktop-block p { font-size: 15px; color: #CCC; line-height: 1.6; }

        @media screen and (min-width: 768px) {
            .code-display, .lang-wrapper { display: none !important; }
            .desktop-block { display: flex !important; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%;}
        }
    </style>
</head>
<body>

    <!-- PC端拦截页 -->
    <div class="desktop-block">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
        <h2>Mobile Only Access</h2>
        <p>Please scan the QR code directly with your smartphone camera.</p>
    </div>

    <!-- 移动端：右上角语言切换 -->
    <div class="lang-wrapper" id="langWrapper">
        <div class="lang-btn" id="langBtn"><span id="currentLang">ENG</span></div>
        <div class="lang-dropdown">
            <div class="lang-option active" data-lang="en">ENG</div>
            <div class="lang-option" data-lang="es">SPA</div>
            <div class="lang-option" data-lang="pt">POR</div>
        </div>
    </div>

    <!-- 移动端：屏幕正中央验证码 -->
    <div class="code-display">
        <div class="code-value" id="verifyCode">----------</div>
    </div>

<script>
// ==================== 多语言配置 ====================
const I18N = {
    en: { label: 'ENG' },
    es: { label: 'SPA' },
    pt: { label: 'POR' }
};

// ==================== 语言切换逻辑 ====================
const langWrapper = document.getElementById('langWrapper');
const langBtn = document.getElementById('langBtn');
const currentLangEl = document.getElementById('currentLang');
const options = document.querySelectorAll('.lang-option');

langBtn.addEventListener('click', (e) => { e.stopPropagation(); langWrapper.classList.toggle('open'); });
document.addEventListener('click', () => langWrapper.classList.remove('open'));

options.forEach(opt => {
    opt.addEventListener('click', (e) => {
        e.stopPropagation();
        const lang = opt.dataset.lang;
        applyLanguage(lang);
        langWrapper.classList.remove('open');
    });
});

function applyLanguage(lang) {
    const data = I18N[lang];
    if (!data) return;
    currentLangEl.textContent = data.label;
    options.forEach(o => o.classList.toggle('active', o.dataset.lang === lang));
    localStorage.setItem('authnow_lang', lang);
}

// ==================== 初始化 ====================
(function init() {
    // 提取 URL 中的 10 位验证码
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const codeEl = document.getElementById('verifyCode');
    if (code && code.trim().length > 0) {
        codeEl.textContent = code.trim();
    }

    // 恢复上次语言
    const savedLang = localStorage.getItem('authnow_lang') || 'en';
    applyLanguage(savedLang);

    // PC端检测兜底
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (!isMobile && window.innerWidth >= 768) {
        document.querySelector('.code-display').style.display = 'none';
        document.querySelector('.lang-wrapper').style.display = 'none';
        document.querySelector('.desktop-block').style.display = 'flex';
    }
})();
</script>
</body>
</html>
