<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Verification</title>
    <style>
        /* --- 基础样式重置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- 顶部导航栏 (Header) --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            height: 60px;
        }
        .menu-icon { width: 24px; height: 24px; cursor: pointer; }
        .header-logo { height: 40px; }
        .lang-btn {
            border: 1px solid #333;
            padding: 5px 10px;
            font-size: 14px;
            font-weight: bold;
            background: transparent;
            cursor: pointer;
        }

        /* --- 主内容区 --- */
        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 产品标题 */
        .product-title {
            align-self: flex-start;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            margin-left: 5px;
        }

        /* 验证卡片 */
        .verify-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 30px;
        }
        .verify-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .shield-icon { width: 35px; height: 35px; }
        .verify-text h2 {
            color: #009900; /* 绿色 AUTHENTIC */
            font-size: 20px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .verify-code {
            font-size: 18px;
            font-weight: bold;
            color: #000;
        }
        .arrow-icon {
            width: 20px;
            height: 20px;
            opacity: 0.6;
        }

        /* 产品图片区域 */
        .product-image-container {
            width: 100%;
            max-width: 350px;
            margin-top: 20px;
            text-align: center;
        }
        .product-image {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* --- 底部说明文字 --- */
        .footer-text {
            margin-top: 40px;
            padding: 0 20px;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            text-align: left;
        }
        .footer-weight {
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }

        /* --- 底部图标 --- */
        .bottom-icon-container {
            margin-top: auto; /* 推到底部 */
            padding: 30px 0;
            text-align: center;
            width: 100%;
        }
        .bottom-icon {
            width: 40px; /* 您可以根据实际图片大小调整这个数值 */
            height: auto;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="header">
        <!-- 菜单图标 (使用SVG模拟) -->
        <svg class="menu-icon" viewBox="0 0 24 24" fill="#333">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
        
        <!-- 顶部 Logo -->
        <img src="logo_indufar.png" alt="Indufar Logo" class="header-logo">
        
        <button class="lang-btn">ENG</button>
    </div>

    <!-- 主体内容 -->
    <div class="main-content">
        <div class="product-title">T.G. 15 mg</div>

        <!-- 验证卡片 -->
        <div class="verify-card">
            <div class="verify-left">
                <!-- 盾牌图标 -->
                <img src="icon_authentic.png" alt="Authentic" class="shield-icon">
                <div class="verify-text">
                    <h2>AUTHENTIC</h2>
                    <!-- CODE 将通过 JS 动态插入 -->
                    <div class="verify-code">CODE: <span id="dynamic-code">LOADING...</span></div>
                </div>
            </div>
            <!-- 右侧箭头 -->
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="#000">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
            </svg>
        </div>

        <!-- 药品盒子图片 -->
        <div class="product-image-container">
            <img src="product_box_tg15.png" alt="T.G. 15mg Box" class="product-image">
        </div>

        <!-- 底部说明文字 -->
        <div class="footer-text">
            The above alphanumeric code must match in code and color with what is printed on the product label to verify its authenticity.
        </div>
        <div class="footer-weight">15 mg</div>
    </div>

    <!-- 底部图标 -->
    <div class="bottom-icon-container">
        <img src="icon_verified.png" alt="Verified" class="bottom-icon">
    </div>

    <script>
        // 获取 URL 中的 code 参数并显示
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // 页面加载时执行
        window.onload = function() {
            const code = getQueryParam('code');
            const codeElement = document.getElementById('dynamic-code');
            
            if (code) {
                // 如果 URL 有 ?code=xxx，则显示该代码
                codeElement.textContent = code;
            } else {
                // 如果没有代码，显示默认值或隐藏
                codeElement.textContent = "0BWqNe8AQd"; // 默认显示的示例代码
            }
        };
    </script>
</body>
</html>
