<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AuthNow Verification</title>
    <style>
        /* 全局重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            height: 100vh; 
            display: flex; 
            flex-direction: column;
        }

        /* --- 顶部导航栏 --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #fff;
        }

        .menu-icon {
            width: 40px; height: 40px;
            background: #f5f5f5;
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .top-logo img {
            height: 40px;
            display: block;
        }

        /* 语言选择框 */
        .lang-box {
            border: 2px solid #000;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 14px;
            background: transparent;
            color: #000;
            cursor: pointer;
            user-select: none;
        }

        /* --- 主要内容区域 --- */
        .main-content {
            flex: 1;
            padding: 0 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-title {
            width: 100%;
            text-align: left;
            font-size: 20px;
            font-weight: 800;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        /* 验证状态条 */
        .auth-card {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            margin-bottom: 30px;
        }

        .auth-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .shield-icon {
            width: 50px; height: 50px;
        }

        .auth-text {
            display: flex;
            flex-direction: column;
        }

        .status-text {
            color: #009900;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        /* 验证码样式 */
        .code-text {
            color: #000;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .arrow-icon {
            font-size: 24px;
            color: #000;
            font-weight: bold;
        }

        .product-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .product-image-container img {
            max-width: 80%;
            height: auto;
            object-fit: contain;
        }

        .footer-desc {
            width: 100%;
            text-align: left;
            font-size: 14px;
            color: #333;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .bottom-icons {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .icon-circle {
            width: 60px; height: 60px;
            background-color: #CFAA28;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }
        
        .icon-circle svg {
            width: 30px; height: 30px;
            fill: #fff;
        }

        /* PC端拦截样式 */
        .desktop-block { 
            display: none; text-align: center; max-width: 400px; 
            background: rgba(0,0,0,0.05); padding: 40px; border-radius: 20px;
            margin: auto;
        }
        .desktop-block h2 { font-size: 20px; margin-bottom: 12px; }
        .desktop-block p { font-size: 15px; color: #666; line-height: 1.6; }

        @media screen and (min-width: 768px) {
            .header, .main-content { display: none !important; }
            .desktop-block { display: block !important; }
        }
    </style>
</head>
<body>

    <!-- PC端拦截 -->
    <div class="desktop-block">
        <h2>📱 Mobile Only Access</h2>
        <p>Please scan the QR code directly with your smartphone camera to verify the product.</p>
    </div>

    <!-- 移动端内容 -->
    <div class="header">
        <div class="menu-icon">☰</div>
        <div class="top-logo">
            <img src="logo.png" alt="Logo">
        </div>
        <div class="lang-box" id="langBtn">ENG</div>
    </div>

    <div class="main-content">
        <div class="product-title">T.G. 15 mg</div>

        <div class="auth-card">
            <div class="auth-left">
                <svg class="shield-icon" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="#003399"/>
                    <path d="M50 20 L75 35 L70 65 L50 85 L30 65 L25 35 Z" fill="#fff" opacity="0.2"/>
                    <path d="M50 30 L65 40 L62 60 L50 75 L38 60 L35 40 Z" fill="#00cc66"/>
                    <path d="M45 50 L50 55 L60 40" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div class="auth-text">
                    <span class="status-text">AUTHENTIC</span>
                    <!-- 核心：这里显示动态验证码 -->
                    <span class="code-text">CODE: <span id="dynamicCode">LOADING...</span></span>
                </div>
            </div>
            <div class="arrow-icon">›</div>
        </div>

        <div class="product-image-container">
            <img src="product.png" alt="Product Box" onerror="this.style.display='none'">
        </div>

        <div class="footer-desc">
            The above alphanumeric code must match in code and color with what is printed on the product label to verify its authenticity.<br><br>
            15 mg
        </div>

        <div class="bottom-icons">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
            </div>
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            </div>
        </div>
    </div>

<script>
    // 1. 自动读取 URL 中的 code 参数
    (function() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const codeEl = document.getElementById('dynamicCode');
        
        if (code && code.trim().length > 0) {
            codeEl.textContent = code.trim().toUpperCase(); // 自动转大写，更规范
        } else {
            codeEl.textContent = 'INVALID LINK'; // 没带参数时显示提示
        }
    })();

    // 2. 简单的语言切换逻辑（ENG/SPA/POR）
    const langBtn = document.getElementById('langBtn');
    const langs = ['ENG', 'SPA', 'POR'];
    let currentLangIndex = 0;

    langBtn.addEventListener('click', () => {
        currentLangIndex = (currentLangIndex + 1) % langs.length;
        langBtn.textContent = langs[currentLangIndex];
        
        // 这里可以扩展更多语言的文案替换
        // 目前仅切换按钮文字，如需全文切换可补充逻辑
    });
</script>
</body>
</html>
